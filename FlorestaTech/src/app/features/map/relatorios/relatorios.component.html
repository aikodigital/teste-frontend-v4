  <div class="text-center">
    <p class="text-muted">RELATÓRIO DE EQUIPAMENTO</p>
  </div>
  <div class="body-modal">
    <div class="p-2">
      <h5 style="color: #fe8901;"><b>{{ equipament.name }}</b></h5>
      <p>
        <b>Modelo:</b>
        {{ equipament.modelo.name }}</p>
    </div>
    <hr class="m-0">
    <div class="table-responsive tabela mt-4"
      style="max-height: 50vh; overflow: auto; border-bottom: 1px solid
      #dee2e6;">
      <table class="table align-middle table-striped table-nowrap table-hover">
        <thead class="table-ligth">
          <tr>
            <td>Horário</td>
            <td>Latitude - Longitude</td>
            <td>Estado</td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let equipament of equipament.positionHitory | paginate: {
            itemsPerPage: 15, currentPage: paginaAtual }; let i= index">
            <td>
              <span>{{ equipament.date | date: 'dd/MM/yyyy'}} às {{
                getHours(equipament.date) }}h</span>
            </td>
            <td>
              <span>[ {{equipament.lat}} - {{equipament.lon}} ]</span>
            </td>
            <td>
              <span class="badge-states"
                [style.backgroundColor]="getStateEquipament(equipament.date,
                'color')">
                {{ getStateEquipament(equipament.date, 'state') }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <ng-container>
      <div class="text-end me-3 pe-1 pt-3 mb-0"
        *ngIf="equipament.positionHitory.length> 15">
        <pagination-controls (pageChange)="paginaAtual= $event"
          previousLabel="Anterior" nextLabel="Próximo"></pagination-controls>
      </div>
    </ng-container>
  </div>
</section>
